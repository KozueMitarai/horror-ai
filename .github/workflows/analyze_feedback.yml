name: Analyze Feedback and Update Knowledge Base

# Issue が新規作成されたときにトリガーする
on:
  issues:
    types: [opened]

# 必要な権限を設定する
# contents: write … knowledge/horror.md の変更をコミット・プッシュするため
# issues: write  … Issue へのコメント投稿・クローズのため
permissions:
  contents: write
  issues: write

# 同時に複数のIssueが立った場合でも1件ずつ処理する。
# （並行するとナレッジベースへのコミットが push 時に衝突するため）
concurrency:
  group: "knowledge-base"
  cancel-in-progress: false

jobs:
  analyze-feedback:
    # 感想Issue（サイトの感想フォームが生成するタイトル）だけを対象にする。
    # 不具合報告などの通常のIssueが自動でクローズされるのを防ぐ。
    if: startsWith(github.event.issue.title, '感想')
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリをチェックアウトする
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 環境をセットアップする
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. フィードバック解析スクリプトを実行する
      #    GEMINI_API_KEY は GitHub Secrets から安全に渡す
      - name: Run feedback analysis script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # リポジトリ変数で上書き可能（未設定ならスクリプト側の既定モデルを使う）
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python process_feedback.py

      # 4. 更新された knowledge/horror.md を Git にコミットしてプッシュする
      - name: Commit and push knowledge base update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 古い分析はスクリプトが feedback_archive.md へ移動するため、両方を対象にする
          git add knowledge/horror.md knowledge/feedback_archive.md
          # 変更がない場合はコミット・プッシュをスキップする
          if git diff --cached --quiet; then
            echo "No knowledge base changes to commit."
            exit 0
          fi
          git commit -m "docs: Issue #${{ github.event.issue.number }} のフィードバックをナレッジベースに反映"
          # 実行中に main が進んでいた場合に備え、rebase してから再試行する
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto the latest main..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "Failed to push the knowledge base update after 3 attempts."
          exit 1

      # 5. 処理完了をIssueにコメントし、Issueをクローズする
      - name: Comment on issue and close it
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            // コメントを投稿する
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ **フィードバックを反映しました！**\n\nこのIssueの内容をGemini APIで分析し、ホラー執筆ナレッジベース（\`knowledge/horror.md\`）に追記しました。貴重なご意見ありがとうございました。\n\n今後の作品制作に活かしてまいります。👻`
            });

            // Issueをクローズする
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
